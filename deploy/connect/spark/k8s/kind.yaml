# A local Kubernetes cluster for Spark ingestion on Kubernetes (S5b, deploy/connect/README.md):
#   kind create cluster --config deploy/connect/spark/k8s/kind.yaml
# One control plane and two workers, so executors spread over nodes. kindnet enforces
# NetworkPolicy. Local evidence only; a hosted cluster brings its own.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridian-spark
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
