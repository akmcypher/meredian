# Secured Kafka for connector certification (Phase 3 K1). Local testing only: ports bind to
# 127.0.0.1, the PKI is generated fresh on every start (certify-secure/certs.sh) and every
# password is a fixed test value.
#   docker compose -p meridian-certify-secure -f deploy/connect/certify-secure.compose.yml up -d --wait
# Listeners (host side):
#   127.0.0.1:39291  SASL_SSL  SCRAM-SHA-512 (meridian-scram) and PLAIN (meridian-plain)
#   127.0.0.1:39292  SSL with required client certificates (mTLS)
# Client material is written to deploy/connect/certify-secure/out (ignored by Git).
x-image: &image apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
services:
  certs:
    image: *image
    user: "0"
    entrypoint: ["bash", "/scripts/certs.sh"]
    volumes:
      - ./certify-secure/certs.sh:/scripts/certs.sh:ro
      - ./certify-secure/out:/certs
  kafka-secure:
    image: *image
    hostname: kafka-secure
    depends_on:
      certs: {condition: service_completed_successfully}
    volumes: ["./certify-secure/out:/certs:ro"]
    ports: ["127.0.0.1:39291:39291", "127.0.0.1:39292:39292"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: bWVyaWRpYW4tc2VjdXJl
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-secure:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Listener names avoid "SSL://" and "SASL_" so the image's secrets-file checks stay off and
      # the settings below are used as written.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,SECURE://:39291,MUTUAL://:39292
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-secure:9092,SECURE://localhost:39291,MUTUAL://localhost:39292
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,SECURE:SASL_SSL,MUTUAL:SSL
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/broker.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_PASSWORD: meridian-test-store
      KAFKA_SSL_KEY_PASSWORD: meridian-test-store
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: meridian-test-store
      KAFKA_LISTENER_NAME_MUTUAL_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_SECURE_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512,PLAIN
      KAFKA_LISTENER_NAME_SECURE_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_SECURE_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required user_meridian-plain="meridian-test-plain";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 40
  # The SCRAM credential lives in the cluster metadata; it is added once the broker is up.
  scram:
    image: *image
    depends_on:
      kafka-secure: {condition: service_healthy}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-secure:9092 --alter
        --add-config 'SCRAM-SHA-512=[password=meridian-test-scram]'
        --entity-type users --entity-name meridian-scram
        && touch /tmp/done && sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/done"]
      interval: 2s
      retries: 60
