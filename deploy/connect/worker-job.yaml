apiVersion: batch/v1
kind: Job
metadata:
  name: meridian-connect-agent
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: agent
          # Replace with a built/scanned immutable digest. No fabricated digest supplied.
          image: meridian-connect-agent:UNBUILT
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "768Mi"}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: MERIDIAN_URL, value: "https://YOUR-MERIDIAN-HOST"}
            - {name: INGEST_TOKEN_FILE, value: /run/secrets/ingest_token}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: meridian-connect-agent}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: "16Mi"}
