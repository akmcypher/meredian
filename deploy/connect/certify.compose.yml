# Connector certification sources (deploy/connect/conformance.py, test_kafka.py).
# Local testing only: every port binds to 127.0.0.1 and nothing here holds a real secret.
#   docker compose -f deploy/connect/certify.compose.yml up -d --wait
#   bun run test:python:local connect
# MySQL comes from deploy/ingest/test-sources.compose.yml (127.0.0.1:33306); Postgres from the
# local Supabase stack. Three combined broker/controller nodes so replication, min ISR and
# broker loss are exercised; Karapace (Apache-2.0) stands in for any Confluent-API registry.
x-kafka: &kafka
  image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:39190
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    CLUSTER_ID: bWVyaWRpYW4tY2VydGlmeQ
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
    interval: 5s
    retries: 40
services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["127.0.0.1:39191:39190"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,HOST://127.0.0.1:39191
  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["127.0.0.1:39192:39190"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,HOST://127.0.0.1:39192
  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["127.0.0.1:39193:39190"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,HOST://127.0.0.1:39193
  karapace:
    image: ghcr.io/aiven-open/karapace:5.0.3@sha256:4cf3dbea61eebb6c85a5198ea8f0b6c32ca3e7fe330cf3b9843cf3837fcdb868
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    command: ["python3", "-m", "karapace"]
    ports: ["127.0.0.1:38081:8081"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/subjects', timeout=2)"]
      interval: 5s
      retries: 40
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: karapace
      KARAPACE_CLIENT_ID: karapace
      KARAPACE_GROUP_ID: karapace
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_REPLICATION_FACTOR: 3
      KARAPACE_COMPATIBILITY: BACKWARD
      KARAPACE_LOG_LEVEL: WARNING
