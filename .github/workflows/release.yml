# Signed release: on a version tag, build the Windows package (source tree plus the
# installer/windows launcher, one zip for x64 and ARM64) and a source archive, sign each with
# keyless cosign (Sigstore, GitHub OIDC identity), attach SLSA build provenance, and open a draft
# GitHub release for a maintainer to review and publish. Verify a download with:
#   cosign verify-blob --bundle FILE.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/.+/.github/workflows/release.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE
#   gh attestation verify FILE --repo OWNER/REPO
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Package
        run: node scripts/package-windows.mjs dist-windows "$env:TAG"
      - name: Smoke-test the launcher from the extracted zip
        run: |
          Expand-Archive "dist-windows/meridian-$env:TAG-windows.zip" -DestinationPath "$env:RUNNER_TEMP/pkg"
          $pkg = "$env:RUNNER_TEMP/pkg/meridian-$env:TAG-windows"
          foreach ($f in ".env", ".meridian", "node_modules") { if (Test-Path "$pkg/$f") { throw "$f must not be packaged" } }
          & "$pkg/meridian.cmd" help
          if ($LASTEXITCODE -ne 0) { throw "help failed" }
          & "$pkg/meridian.cmd" doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: dist-windows/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # keyless signing and provenance
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Source archive
        run: |
          mkdir dist-release
          git archive --format=tar.gz --prefix="meridian-$TAG/" \
            -o "dist-release/meridian-$TAG-source.tar.gz" "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: dist-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (cosign keyless)
        run: |
          for f in dist-release/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.tar.gz
            dist-release/*.zip
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist-release/* --verify-tag --generate-notes --draft
