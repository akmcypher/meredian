# Lint, build, typecheck and unit tests. The build runs first because it generates the route tree
# that the typecheck reads.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.122.0
      - name: Extract source artifact without developer state
        run: |
          mkdir "$RUNNER_TEMP/meridian-package"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/meridian-package"
          test ! -e "$RUNNER_TEMP/meridian-package/.env"
          test ! -e "$RUNNER_TEMP/meridian-package/node_modules"
      - name: Install independent backend and application
        working-directory: ${{ runner.temp }}/meridian-package
        run: node scripts/self-host.mjs install
      - name: Verify application and backend from extracted package
        working-directory: ${{ runner.temp }}/meridian-package
        run: |
          node scripts/self-host.mjs start > "$RUNNER_TEMP/meridian-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/auth > /dev/null; then break; fi
            sleep 1
          done
          node scripts/self-host.mjs check
          MAILPIT_URL=http://localhost:58324 RUN_TENANT_E2E=1 node --env-file=.meridian/runtime.env node_modules/vitest/vitest.mjs run --no-file-parallelism src/test/auth-email-lifecycle.e2e.test.ts src/test/native-workspace-identity.e2e.test.ts
      - name: Administrator bootstrap, persistence and forward upgrade
        working-directory: ${{ runner.temp }}/meridian-package
        run: |
          node --env-file=.meridian/runtime.env scripts/self-host-acceptance.mjs seed
          node scripts/self-host.mjs stop
          node scripts/self-host.mjs install
          node --env-file=.meridian/runtime.env scripts/self-host-acceptance.mjs verify
          node scripts/self-host.mjs upgrade
          node --env-file=.meridian/runtime.env scripts/self-host-acceptance.mjs verify
          node scripts/self-host.mjs backup
          node scripts/self-host.mjs stop
      - name: Restore into another independently initialized installation
        run: |
          mkdir "$RUNNER_TEMP/meridian-restore"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/meridian-restore"
          cd "$RUNNER_TEMP/meridian-restore"
          MERIDIAN_PORT=8280 MERIDIAN_BACKEND_PORT=59321 node scripts/self-host.mjs install
          cp "$RUNNER_TEMP/meridian-package/.meridian/acceptance.json" .meridian/acceptance.json
          backup_dir=$(find "$RUNNER_TEMP/meridian-package/.meridian/backups" -mindepth 1 -maxdepth 1 -type d | head -1)
          node scripts/self-host.mjs restore "$backup_dir"
          node --env-file=.meridian/runtime.env scripts/self-host-acceptance.mjs verify
          node --env-file=.meridian/runtime.env scripts/self-host-acceptance.mjs realtime
          if node scripts/self-host.mjs restore "$backup_dir"; then
            echo "Restore incorrectly accepted an occupied target"
            exit 1
          fi
      - name: Stop only the independent installation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/meridian-package/.meridian/installation.json"; then
            cd "$RUNNER_TEMP/meridian-package"
            node scripts/self-host.mjs stop
          fi
      - name: Stop only the restore installation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/meridian-restore/.meridian/installation.json"; then
            cd "$RUNNER_TEMP/meridian-restore"
            node scripts/self-host.mjs stop
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx eslint .
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bunx vitest run
        env:
          RUN_TENANT_E2E: "0"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONNECT_TEST_HOST: 127.0.0.1
      CONNECT_TEST_PORT: "54322"
      CONNECT_TEST_DB: connect_source
      AUTH_TEST_DB_ISOLATED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.122.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - name: Prior supported database and storage (through 0076)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/post-0076"
          for migration in supabase/migrations/*.sql; do
            if [[ "${migration##*/}" > "20261104130000_0076_community_partition_publication.sql" ]]; then
              mv "$migration" "$RUNNER_TEMP/post-0076/"
            fi
          done
          trap 'mv "$RUNNER_TEMP/post-0076/"*.sql supabase/migrations/' EXIT
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor > stack.log 2>&1
      - name: Local-only test configuration
        shell: bash
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=')"
          fixture_password=$(DB_URL="$DB_URL" node -e 'process.stdout.write(decodeURIComponent(new URL(process.env.DB_URL).password))')
          echo "::add-mask::$fixture_password"
          echo "PGPASSWORD=$fixture_password" >> "$GITHUB_ENV"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env
      - name: Existing administrator upgrade fixture
        run: node --env-file=.env scripts/seed-legacy-auth.mjs
      - name: Upgrade existing schema and accounts to current migrations
        run: supabase migration up --local
      - name: Migration inventory and effective default privileges
        run: |
          files=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          applied=$(docker exec supabase_db_meridian psql -U postgres -tAc "select count(*) from supabase_migrations.schema_migrations")
          test "$files" -eq "$applied"
          docker exec -i supabase_db_meridian psql -U postgres -v ON_ERROR_STOP=1 < src/test/client-table-privileges.sql
          docker exec -i supabase_db_meridian psql -U postgres -v ON_ERROR_STOP=1 < src/test/client-function-privileges.sql
      - name: Worker dependencies and source fixtures
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r deploy/connect/requirements-test.txt
          .venv/bin/python deploy/connect/seed_acceptance.py
          docker compose -f deploy/ingest/test-sources.compose.yml up -d --wait
          docker compose -p meridian-certify -f deploy/connect/certify.compose.yml up -d --wait
      - name: Python connector certification (fault injection runs alone)
        run: bun run test:python:local connect
      - name: Start Community
        run: |
          node scripts/engine-keys.mjs | grep '^ENGINE_TOKEN_SIGNING_KEY=' >> .env
          nohup bun run dev -- --port 8080 --strictPort > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          exit 1
      - name: Checkpoint, replay, authorization, batching and safe reconciliation
        run: bun run test:e2e:local
      - name: Stop disposable fixtures
        if: always()
        run: |
          docker compose -p meridian-certify -f deploy/connect/certify.compose.yml down -v
          docker compose -f deploy/ingest/test-sources.compose.yml down -v
          supabase stop --no-backup

  fresh-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.122.0
      - name: Fresh complete migration chain and privileges
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor > stack.log 2>&1
          files=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          applied=$(docker exec supabase_db_meridian psql -U postgres -tAc "select count(*) from supabase_migrations.schema_migrations")
          test "$files" -eq "$applied"
          docker exec -i supabase_db_meridian psql -U postgres -v ON_ERROR_STOP=1 < src/test/client-table-privileges.sql
          docker exec -i supabase_db_meridian psql -U postgres -v ON_ERROR_STOP=1 < src/test/client-function-privileges.sql
      - name: Stop disposable fresh database
        if: always()
        run: supabase stop --no-backup
